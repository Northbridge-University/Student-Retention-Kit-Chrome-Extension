<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SRK Console</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1e1e1e;
            color: #e0e0e0;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: #2d2d2d;
            border-bottom: 1px solid #404040;
            user-select: none;
            flex-shrink: 0;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toolbar-title {
            font-size: 13px;
            font-weight: 600;
            color: #ccc;
            letter-spacing: 0.3px;
        }

        .toolbar-badge {
            font-size: 11px;
            color: #888;
            background: #383838;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .toolbar-actions {
            display: flex;
            gap: 6px;
        }

        .toolbar-btn {
            background: none;
            border: 1px solid #555;
            color: #aaa;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            transition: all 0.15s;
        }

        .toolbar-btn:hover {
            background: #383838;
            color: #e0e0e0;
            border-color: #777;
        }

        .filter-bar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 16px;
            background: #252525;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }

        .filter-btn {
            background: none;
            border: none;
            color: #888;
            padding: 3px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            transition: all 0.15s;
        }

        .filter-btn:hover { color: #ccc; background: #333; }
        .filter-btn.active { color: #e0e0e0; background: #404040; }

        .filter-btn.log-filter { border-left: 2px solid transparent; }
        .filter-btn.log-filter[data-level="warn"] { border-left-color: #ffa500; }
        .filter-btn.log-filter[data-level="error"] { border-left-color: #ff4444; }
        .filter-btn.log-filter[data-level="info"] { border-left-color: #4fc3f7; }
        .filter-btn.log-filter[data-level="ping"] { border-left-color: #f48fb1; }
        .filter-btn.log-filter[data-level="submission"] { border-left-color: #4caf50; }

        .search-input {
            flex: 1;
            background: #1e1e1e;
            border: 1px solid #444;
            color: #e0e0e0;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-family: inherit;
            margin-left: 8px;
            outline: none;
            transition: border-color 0.15s;
        }

        .search-input:focus { border-color: #0078d4; }
        .search-input::placeholder { color: #666; }

        .console-output {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .log-entry {
            padding: 3px 16px;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            line-height: 1.5;
        }

        .log-entry:hover { background: rgba(255,255,255,0.03); }

        .log-entry .timestamp {
            color: #666;
            white-space: nowrap;
            flex-shrink: 0;
            font-size: 12px;
        }

        .log-entry .level {
            width: 42px;
            flex-shrink: 0;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            padding-top: 1px;
        }

        .log-entry .message {
            white-space: pre-wrap;
            word-break: break-word;
            flex: 1;
        }

        /* Level colors */
        .log-entry.log .level { color: #888; }
        .log-entry.log .message { color: #e0e0e0; }

        .log-entry.warn .level { color: #ffa500; }
        .log-entry.warn .message { color: #ffa500; }
        .log-entry.warn { background: rgba(255,165,0,0.04); }

        .log-entry.error .level { color: #ff4444; }
        .log-entry.error .message { color: #ff6b6b; }
        .log-entry.error { background: rgba(255,68,68,0.04); }

        .log-entry.info .level { color: #4fc3f7; }
        .log-entry.info .message { color: #4fc3f7; }

        .log-entry.ping .level { color: #f48fb1; }
        .log-entry.ping .message { color: #f8bbd0; }

        .log-entry.submission .level { color: #4caf50; }
        .log-entry.submission .message { color: #81c784; }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #555;
            gap: 8px;
        }

        .empty-state-icon { font-size: 32px; opacity: 0.5; }
        .empty-state-text { font-size: 13px; }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 16px;
            background: #007acc;
            color: #fff;
            font-size: 11px;
            flex-shrink: 0;
        }

        .status-bar.disconnected { background: #6c6c6c; }

        /* Scrollbar */
        .console-output::-webkit-scrollbar { width: 8px; }
        .console-output::-webkit-scrollbar-track { background: transparent; }
        .console-output::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        .console-output::-webkit-scrollbar-thumb:hover { background: #777; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="toolbar-left">
            <span class="toolbar-title">Student Retention Kit &mdash; Console</span>
            <span class="toolbar-badge" id="logCount">0 entries</span>
        </div>
        <div class="toolbar-actions">
            <button class="toolbar-btn" id="exportBtn" title="Export logs as .txt">Export</button>
            <button class="toolbar-btn" id="scrollBottomBtn" title="Scroll to bottom">Scroll to Bottom</button>
            <button class="toolbar-btn" id="clearBtn" title="Clear all logs">Clear</button>
        </div>
    </div>

    <div class="filter-bar">
        <button class="filter-btn active" data-level="all">All</button>
        <button class="filter-btn log-filter" data-level="log">Log</button>
        <button class="filter-btn log-filter" data-level="warn">Warn</button>
        <button class="filter-btn log-filter" data-level="error">Error</button>
        <button class="filter-btn log-filter" data-level="info">Info</button>
        <button class="filter-btn log-filter" data-level="ping">Ping</button>
        <button class="filter-btn log-filter" data-level="submission">Submission</button>
        <input type="text" class="search-input" id="searchInput" placeholder="Filter output...">
    </div>

    <div class="console-output" id="output">
        <div class="empty-state" id="emptyState">
            <div class="empty-state-icon">&#9002;</div>
            <div class="empty-state-text">Waiting for logs from the side panel...</div>
        </div>
    </div>

    <div class="status-bar" id="statusBar">
        <span id="statusText">Connected</span>
        <span id="statusDetail"></span>
    </div>

    <script src="console.js"></script>
</body>
</html>
